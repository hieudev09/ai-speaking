apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-config
  namespace: ai-platform
data:
  NODE_ENV: "production"
  PORT: "3001"
  FRONTEND_URL: "https://ai-speaking.com"
  ADMIN_URL: "https://admin.ai-speaking.com"
  AI_GATEWAY_URL: "http://ai-gateway-service:3003"
  REDIS_URL: "redis://redis-service.ai-platform.svc.cluster.local:6379"
  LOG_LEVEL: "info"
  SERVICE_NAME: "ai-speaking-platform"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:REPLACE_WITH_PROD_PASSWORD@postgres-service.ai-platform.svc.cluster.local:5432/ai_speaking_prod?sslmode=require"
  DIRECT_URL: "postgresql://postgres:REPLACE_WITH_PROD_PASSWORD@postgres-service.ai-platform.svc.cluster.local:5432/ai_speaking_prod?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_PROD_JWT_SECRET_KEY_MIN_32_CHARS"
  REFRESH_TOKEN_SECRET: "REPLACE_WITH_PROD_REFRESH_TOKEN_SECRET_MIN_32_CHARS"
  OPENAI_API_KEY: "sk-..."
  ANTHROPIC_API_KEY: "sk-ant-..."
  GOOGLE_AI_API_KEY: "AIza..."
  STRIPE_SECRET_KEY: "sk_live_..."
  STRIPE_WEBHOOK_SECRET: "whsec_..."
